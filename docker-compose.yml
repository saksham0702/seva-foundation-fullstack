services:
  backend:
    build: ./seva-backend
    ports:
      - "5000:5000"
    env_file:
      - ./seva-backend/.env
    # Lets the container reach MongoDB running on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./seva-frontend
    ports:
      - "3000:3000"
    environment:
      # Browser calls this URL directly, so it must be reachable from the user's machine
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
